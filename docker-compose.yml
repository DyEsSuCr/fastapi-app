services:
  db:
    image: postgres:15-alpine
    container_name: fastapi-app-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata-${ENVIRONMENT}:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: fastapi-app-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  web:
    build: .
    container_name: fastapi-app-web
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      - db
      - redis
    networks:
      - app-network

  celery:
    build: .
    container_name: fastapi-app-celery
    command: celery -A src.celery.c_app worker --loglevel=INFO
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      REDIS_URL: ${REDIS_URL}
    networks:
      - app-network

volumes:
  pgdata-dev:
  pgdata-prod:
  pgdata-staging:

networks:
  app-network:
    driver: bridge